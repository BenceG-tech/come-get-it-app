name: Distribute existing Come Get It build

on:
  workflow_dispatch:
    inputs:
      asc_build_id:
        type: string
        required: true
        description: App Store Connect build ID

jobs:
  distribute_to_internal_testers:
    name: Add build to internal TestFlight group
    type: testflight
    params:
      asc_build_id: ${{ inputs.asc_build_id }}
      internal_groups:
        - Come Get It belső teszt
      changelog: |
        Build 19: natív Apple Maps, eredeti középre igazított login logó, gyors indítás,
        négy aktív kategóriafeltöltött jutalom és felhasználónként egyszeri beváltás.
        Ellenőrizendő: lista- és részlettérkép; minden kategórián egyetlen vissza gomb;
        második azonos jutalombeváltás elutasítása; partneri QR-beolvasás és ismételt
        QR elutasítása; kijelentkezés, jelszó-visszaállítás és fióktörlés.
      submit_beta_review: false
