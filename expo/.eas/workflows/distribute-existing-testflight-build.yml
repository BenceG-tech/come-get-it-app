name: Distribute existing Come Get It build

on:
  workflow_dispatch:
    inputs:
      asc_build_id:
        type: string
        required: true
        description: App Store Connect build ID

jobs:
  distribute_to_internal_testers:
    name: Add build to internal TestFlight group
    type: testflight
    params:
      asc_build_id: ${{ inputs.asc_build_id }}
      internal_groups:
        - Come Get It belső teszt
      changelog: |
        Build 12: natív Apple Maps a helylistán és a hely részletes oldalán,
        hitelesített jutalomrészlet, Pilot jutalomkép, beváltási ellenőrzések és
        következetes visszanavigáció minden jutalomkategóriából.
        Ellenőrizendő: lista- és részlettérkép, venue markerek; kategória-vissza;
        100 pontos Pilot jutalom; partneri QR-beolvasás; ismételt QR elutasítása;
        kijelentkezés és jelszó-visszaállítás.
      submit_beta_review: false
