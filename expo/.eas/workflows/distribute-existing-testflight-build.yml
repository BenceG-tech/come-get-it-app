name: Distribute existing Come Get It build

on:
  workflow_dispatch:
    inputs:
      asc_build_id:
        type: string
        required: true
        description: App Store Connect build ID

jobs:
  distribute_to_internal_testers:
    name: Add build to internal TestFlight group
    type: testflight
    params:
      asc_build_id: ${{ inputs.asc_build_id }}
      internal_groups:
        - Come Get It belső teszt
      changelog: |
        Friss release candidate a teljes iPhone-os végponttól végpontig teszthez.
        Ellenőrizendő: regisztráció, belépés, venue és reward, QR-beváltás,
        ismételt beváltás elutasítása, kijelentkezés, jelszó-visszaállítás és fióktörlés.
      submit_beta_review: false
